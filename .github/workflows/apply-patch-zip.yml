name: Apply add-match patch bundle

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to check out, patch, and push (this becomes your PR branch)'
        required: true
        default: 'PR'
      zip_path:
        description: 'Path to patch bundle zip in repo root of target_branch'
        required: true
        default: 'addmatch-patch-bundle.zip'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Extract bundle over repo
        run: |
          unzip -o "${{ inputs.zip_path }}"
          rm -f "${{ inputs.zip_path }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add domain to @match: popup + dashboard button, comma/shorthand expansion"
          git push origin HEAD:${{ inputs.target_branch }}
